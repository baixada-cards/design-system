<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truco — icon exploration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Kalam:wght@300;400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="branding.css">

  <style>
    html, body { margin: 0; padding: 0; background: #1a1410; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    code { font-size: 12px; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ornaments.jsx"></script>
  <script type="text/babel" src="truco-icon.jsx"></script>
  <script type="text/babel" src="truco-artboards.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    const App = () => (
      <DesignCanvas title="Truco — icon exploration">
        <DCSection id="directions" title="01 · Six directions">
          <DCArtboard id="t1" label="Six faces on the bordeaux chassis" width={1200} height={720}>
            <T1_Directions />
          </DCArtboard>
        </DCSection>

        <DCSection id="recommendation" title="02 · The pick — 1 de espadas">
          <DCArtboard id="t2" label="Composition variants" width={1200} height={720}>
            <T2_AceVariations />
          </DCArtboard>
          <DCArtboard id="t3" label="Scale test — does it survive a favicon?" width={1200} height={720}>
            <T3_Scales />
          </DCArtboard>
        </DCSection>

        <DCSection id="family" title="03 · The family">
          <DCArtboard id="t4" label="Baixada + Truco + future games" width={1200} height={720}>
            <T4_Family />
          </DCArtboard>
        </DCSection>

        <DCSection id="context" title="04 · In context">
          <DCArtboard id="t5" label="Homescreen, lobby tile, share image" width={1200} height={720}>
            <T5_InContext />
          </DCArtboard>
        </DCSection>

        <DCSection id="rules" title="05 · Favicon & page title rules">
          <DCArtboard id="t6" label="Answers to your two questions" width={1200} height={720}>
            <T6_Answers />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
