<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baixada — branding, first pass</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Kalam:wght@300;400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="branding.css">

  <style>
    html, body { margin: 0; padding: 0; background: #1a1410; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ornaments.jsx"></script>
  <script type="text/babel" src="artboards.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    const App = () => (
      <DesignCanvas title="Baixada — branding, first pass">
        <DCSection id="positioning" title="01 · Positioning">
          <DCArtboard id="a1" label="The metaphor & the system" width={1200} height={720}>
            <A1_Positioning />
          </DCArtboard>
        </DCSection>

        <DCSection id="umbrella" title="02 · Umbrella brand — Baixada">
          <DCArtboard id="a2" label="Primary lockup — hero" width={1200} height={720}>
            <A2_UmbrellaPrimary />
          </DCArtboard>
          <DCArtboard id="a3" label="Variations — three registers" width={1200} height={720}>
            <A3_UmbrellaAlternates />
          </DCArtboard>
        </DCSection>

        <DCSection id="games" title="03 · Per-game lockups">
          <DCArtboard id="a4" label="Truco · Lab, Truco, Escopa, Bisca" width={1200} height={720}>
            <A4_GameLockups />
          </DCArtboard>
        </DCSection>

        <DCSection id="system" title="04 · Color & type system">
          <DCArtboard id="a5" label="Inherits Tactile tokens" width={1200} height={720}>
            <A5_ColorAndType />
          </DCArtboard>
        </DCSection>

        <DCSection id="warmth" title="05 · The farm, family Easter-eggs">
          <DCArtboard id="a6" label="How na baixada shows up" width={1200} height={720}>
            <A6_EasterEggs />
          </DCArtboard>
        </DCSection>

        <DCSection id="domains" title="06 · Domains & sign-off">
          <DCArtboard id="a7" label="Where Baixada lives" width={1200} height={720}>
            <A7_DomainsSummary />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
